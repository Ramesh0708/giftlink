[build]
  command = "npm run build"
  publish = "dist"

[functions]
  external_node_modules = ["@resvg/resvg-js"]
  included_files = ["netlify/fonts/**"]

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/how-to"
  to = "/how-to/index.html"
  status = 200

[[redirects]]
  from = "/how-to/"
  to = "/how-to/index.html"
  status = 200

