<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="R_MrDCaUuDRcZ3Tv2mJDmOh0th9WZMI8sY4bZ2XHJPc" />
    <meta
      name="description"
      content="GiftLink is a shareable wishlist so your people can gift what you actually want — from Amazon, Flipkart, and anywhere you shop."
    />
    <link rel="canonical" href="https://wiishlist.netlify.app/" />
    <meta property="og:site_name" content="GiftLink" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GiftLink — gifts without the guessing" />
    <meta
      property="og:description"
      content="Share what you actually want. Friends pick a gift, buy it on Amazon or Flipkart, and nobody doubles up."
    />
    <meta property="og:url" content="https://wiishlist.netlify.app/" />
    <meta property="og:image" content="https://wiishlist.netlify.app/og.jpg" />
    <meta property="og:image:width" content="1280" />
    <meta property="og:image:height" content="720" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GiftLink — gifts without the guessing" />
    <meta name="twitter:image" content="https://wiishlist.netlify.app/og.jpg" />
    <link rel="image_src" href="https://wiishlist.netlify.app/og.jpg" />
    <title>GiftLink — gifts without the guessing</title>
    <meta name="giftlink-chunks" content="" />
    <link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EP4MKTGEZ4', { send_page_view: false });
      function loadGiftLinkAnalytics() {
        if (window.__giftlinkGa) return;
        window.__giftlinkGa = true;
        var script = document.createElement('script');
        script.async = true;
        script.src = 'https://www.googletagmanager.com/gtag/js?id=G-EP4MKTGEZ4';
        document.head.appendChild(script);
      }
      function armAnalytics() {
        addEventListener('pointerdown', loadGiftLinkAnalytics, { once: true, passive: true });
        addEventListener('keydown', loadGiftLinkAnalytics, { once: true });
        setTimeout(loadGiftLinkAnalytics, 8000);
      }
      if (document.readyState === 'complete') armAnalytics();
      else addEventListener('load', armAnalytics, { once: true });

      var chunkMeta = document.querySelector('meta[name="giftlink-chunks"]');
      var chunks = chunkMeta ? chunkMeta.getAttribute('content') || '' : '';
      function preloadChunk(name) {
        var match = chunks.match(new RegExp('(?:^|,)' + name + '=([^,]+)'));
        if (!match) return;
        var link = document.createElement('link');
        link.rel = 'modulepreload';
        link.href = match[1];
        link.crossOrigin = 'anonymous';
        document.head.appendChild(link);
      }
      var path = location.pathname.replace(/\/+$/, '') || '/';
      var listMatch = path.match(/^\/w\/([^/]+)$/);
      if (listMatch) {
        preloadChunk('view');
        var tokens = '';
        try {
          var saved = JSON.parse(localStorage.getItem('giftlink:claims:' + listMatch[1]) || '{}');
          tokens = Object.keys(saved).map(function (key) { return saved[key]; }).filter(Boolean).join(',');
        } catch (e) {}
        var headers = tokens ? { 'x-claim-tokens': tokens } : {};
        window.__giftlinkPrefetch = {
          id: listMatch[1],
          response: fetch('/api/wishlists/' + encodeURIComponent(listMatch[1]), { headers: headers })
        };
      } else if (path === '/') {
        preloadChunk('home');
      } else if (path === '/how-to') {
        preloadChunk('howto');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
